name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup environment
      run: |
        echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
        echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        env

    - name: Get dependencies
      run: sudo apt-get update && sudo apt-get install -yq debhelper fakeroot
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: NPM Clean install
      run: npm ci

    - name: Test
      run: npm test

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Lint (non-blocking due to existing violations)
      id: lint
      continue-on-error: true
      run: npm run lint

    - name: Report lint violations
      if: steps.lint.outcome == 'failure'
      run: |
        echo "::warning::Lint found violations; see the lint step. This check is temporarily non-blocking."
        echo "Lint found violations. See the lint step; it is temporarily non-blocking." >> "$GITHUB_STEP_SUMMARY"

    - name: Build
      env: 
        GENERATE_SOURCEMAP: "false"
      run: |
        echo VITE_APP_GITREV=\"${{ github.sha }}\" >> .env
        npm run build

    - name: Archive raw artifacts
      uses: actions/upload-artifact@v7
      with:
        name: snapweb_raw_${{env.SHA_SHORT}}
        path: dist
        compression-level: 9

    - name: Create changelog
      run: |
        $GITHUB_WORKSPACE/debian/changelog_md2deb.py $GITHUB_WORKSPACE/changelog.md > $GITHUB_WORKSPACE/debian/changelog
        cat $GITHUB_WORKSPACE/debian/changelog

    - name: Create deb package
      env:
        GENERATE_SOURCEMAP: "false"
      run: |
        fakeroot make -f debian/rules clean
        fakeroot make -f debian/rules binary

    - name: Archive deb artifacts
      uses: actions/upload-artifact@v7
      with:
        name: snapweb_debian_package_${{env.SHA_SHORT}}
        path: ${{env.PARENT_DIR}}/snapweb_*.deb
